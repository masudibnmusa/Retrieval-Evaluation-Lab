name: chunking_sweep
corpus: data/corpus
testset: data/testsets/dev.jsonl
primary_metric: ndcg@10
eval_k: [1, 3, 5, 10]
token_budgets: [1000, 2000]     # fair comparison across chunk sizes

grid:
  chunker:
    - {type: fixed, size: 256, overlap: 32}
    - {type: fixed, size: 512, overlap: 64}
    - {type: fixed, size: 1024, overlap: 128}
    - {type: recursive, size: 512, overlap: 64}
    - {type: sentence, size: 256}
    - {type: structure_aware, max_size: 512}
  embedder:
    - {type: hf, model: BAAI/bge-small-en-v1.5}
  retriever:
    - {type: dense}
    - {type: bm25}
    - {type: hybrid, fusion: rrf}
  reranker:
    - {type: none}