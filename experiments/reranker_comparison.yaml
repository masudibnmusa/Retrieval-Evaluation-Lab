name: reranker_comparison
corpus: data/corpus
testset: data/testsets/dev.jsonl
primary_metric: ndcg@5
eval_k: [1, 3, 5, 10]
candidates: 50          # retrieve 50, rerank down to max(eval_k)

grid:
  chunker:
    - {type: recursive, size: 512, overlap: 64}
  embedder:
    - {type: hf, model: BAAI/bge-small-en-v1.5}
  retriever:
    - {type: hybrid, fusion: rrf}
  reranker:
    - {type: none}                                   # baseline (configs[0])
    - {type: cross_encoder, model: cross-encoder/ms-marco-MiniLM-L-6-v2}
    - {type: cohere, model: rerank-v3.5}
    - {type: llm}

# Add this to also score answers (needs ANTHROPIC_API_KEY):
# generation: {enabled: true, context_k: 5}